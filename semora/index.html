<!DOCTYPE html>
<html lang="en" dir="ltr">
<!-- =========================== SEMORA SCHEMA GENERATOR ============================ -->
<head>
    <!-- :::::::::::::::::::::::::: META & FAVICON :::::::::::::::::::::::::: -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Semora – Schema Generator</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/logos/Se.svg">
    <link rel="stylesheet" href="../assets/css/Semora.css">
</head>
<body>
    <!-- ------------------------- HEADER ------------------------- -->
    <div class="header">
        <img src="../assets/images/logos/Se.svg" alt="Semora logo" class="logo" />
        <div class="title-wrap">
            <h1 class="main-title">
                Semora <span class="sub-title">Schema Generator</span>
            </h1>
            <div class="sub">
                All types covered · Instant generation · Ready-to-use JSON‑LD
            </div>
        </div>
    </div>

    <!-- ------------------------- VOCABULARY STATUS ------------------------- -->
    <div class="card" id="dbCard">
        <div class="card-header">
            <span>Vocabulary Status</span>
        </div>
        <div id="dbStatus" class="status-bar">
            <span id="statusText">Loading schema vocabulary…</span>
        </div>
        <div id="loadingStatus" class="alert hidden"></div>
        <div id="statsInfo" class="stats-info"></div>
        <button id="manualRetryBtn" class="secondary hidden">Retry Loading</button>
    </div>

    <!-- ------------------------- WIZARD EDITOR ------------------------- -->
    <div class="card hidden" id="wizardCard">
        <div class="wizard">
            <div class="step-indicator" id="stepIndicator"></div>
            <div class="step-content" id="stepContent"></div>
            <div class="step-actions">
                <button id="prevBtn" class="secondary" disabled>← Previous</button>
                <button id="nextBtn">Next →</button>
                <button id="finishBtn" class="hidden">Generate JSON-LD</button>
            </div>
        </div>
    </div>

    <!-- ------------------------- JSON-LD OUTPUT ------------------------- -->
    <div class="card hidden" id="outputCard">
        <div class="card-header">
            <span>JSON-LD Output</span>
        </div>
        <pre id="jsonOutput"></pre>
        <div class="flex-btns">
            <button id="copyBtn" class="primary">Copy to Clipboard</button>
            <button id="downloadBtn" class="secondary">Download</button>
            <button id="restartBtn" class="secondary">Start Over</button>
        </div>
    </div>

    <!-- ------------------------- FOOTER ------------------------- -->
    <footer class="footer">
        <div class="footer-signature">
            <span class="crafted">crafted by</span>
            <img src="../assets/images/signature.svg" alt="Armin Silatani" class="signature">
        </div>
    </footer>

    <!-- :::::::::::::::::::::::::: SCRIPTS :::::::::::::::::::::::::: -->
    <script src="../assets/js/Semora300.js"></script>
    <script src="../assets/js/Semora.js"></script>
</body>
</html>
