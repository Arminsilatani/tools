<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Service Item Generator</title>

<link rel="stylesheet" href="../assets/css/main.css">
<link rel="stylesheet" href="../assets/css/pages/service-generator.css">

<link rel="icon" href="../assets/images/tools/service-generator.webp">

</head>

<body>

<main class="tool-wrapper">

<header class="tool-header">

<img src="../assets/images/tools/service-generator.webp" class="tool-logo">

<h1 class="tool-title">Service Item Generator</h1>

</header>


<section class="tool-grid">

<div class="tool-card">

<div class="tool-card-header">
<h2>Configuration</h2>
</div>

<form id="generator-form">

<div class="form-group">
<label>Title</label>
<input id="title" placeholder="Cluster Keyword Research">
</div>

<div class="form-group">
<label>data-tab</label>
<input id="tab">
</div>

<div class="form-group">
<label>data-package</label>
<input id="pkg">
</div>

<div class="form-group">
<label>data-category</label>
<input id="category">
</div>

<div class="form-group">
<label>data-plan</label>
<input id="plan">
</div>

<div class="form-group">
<label>data-group</label>
<input id="data-group">
</div>

<div class="form-group">
<label>Checkbox Variant</label>
<select id="finalCheckboxClass">
<option value="white-checkbox">white-checkbox</option>
<option value="green-checkbox">green-checkbox</option>
<option value="green-checkbox-checked" selected>green-checkbox-checked</option>
<option value="yellow-checkbox">yellow-checkbox</option>
<option value="yellow-checkbox-checked">yellow-checkbox-checked</option>
<option value="red-checkbox">red-checkbox</option>
</select>
</div>

<div class="form-group">
<label>Quantity Control</label>
<select id="hasQty">
<option value="no">No</option>
<option value="yes">Yes</option>
</select>
</div>

</form>

</div>


<div class="tool-card">

<div class="tool-card-header">

<h2>Generated HTML</h2>

<button id="copy-button" class="copy-btn">
Copy
</button>

</div>

<textarea id="output-code" class="code-editor" readonly></textarea>

</div>

</section>


<footer class="footer">

<div class="footer-signature">

<span class="crafted">crafted by</span>

<img src="../assets/images/signature.svg" class="signature">

</div>

</footer>

</main>

<script src="../assets/js/service-generator.js"></script>

</body>
</html>
