<!-- =========================== DOCUMENT ============================ -->
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Refacto - Code Beautifier</title>

  <!-- :::::::::::::::::::::::::: FAVICON & STYLES :::::::::::::::::::::::::: -->
  <link rel="icon" type="image/svg+xml" href="../assets/images/logos/Re.svg">
  <link rel="stylesheet" href="../assets/css/Refacto.css">
</head>
<body>
  <!-- =========================== HEADER ============================ -->
  <header class="app-header">
    <div class="logo-area">
      <img src="../assets/images/logos/Re.svg" alt="Re" class="logo-img" onerror="this.style.display='none'">
      <h1 class="logo-title">
        <span class="logo-title-main">Refacto</span>
        <span class="logo-title-sub">Code Beautifier</span>
      </h1>
    </div>
  </header>

  <!-- =========================== MAIN CONTENT ============================ -->
  <div class="main-grid">

    <!-- ------------------------- INPUT PANEL ------------------------- -->
    <div class="panel">
      <div class="panel-header">
        <span>Input</span>
        <span class="badge" id="langBadge">HTML</span>
      </div>
      <div class="panel-body">
        <textarea id="inputCode" placeholder="Paste your HTML, CSS, or JavaScript code here..."></textarea>
      </div>
      <div class="toolbar">
        <button id="beautifyOnlyBtn" class="accent">Beautify</button>
        <select id="langSelect">
          <option value="auto">Auto Detect</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="js">JavaScript</option>
        </select>
      </div>
      <div class="stats" id="inputStats">Characters: 0 | Lines: 0</div>
    </div>

    <!-- ------------------------- OUTPUT PANEL ------------------------- -->
    <div class="panel">
      <div class="panel-header">
        <span>Output</span>
      </div>
      <div class="panel-body">
        <textarea id="outputCode" readonly placeholder="Refactored code will appear here..."></textarea>
      </div>
      <div class="toolbar">
        <button id="copyBtn">Copy</button>
        <button id="downloadBtn">Download</button>
        <button id="clearOutputBtn" class="danger">Clear</button>
      </div>
      <div class="stats" id="outputStats">Characters: 0 | Lines: 0</div>
    </div>

  </div>

  <!-- =========================== FOOTER ============================ -->
  <footer class="footer">
    <div class="footer-signature">
      <span class="crafted">crafted by</span>
      <img src="../assets/images/signature.svg" alt="Armin Silatani" class="signature">
    </div>
  </footer>

  <!-- :::::::::::::::::::::::::: TOAST NOTIFICATION :::::::::::::::::::::::::: -->
  <div id="toast" class="toast"></div>

  <!-- :::::::::::::::::::::::::: SCRIPTS :::::::::::::::::::::::::: -->
  <script src="../assets/js/Refacto.js"></script>
</body>
</html>
