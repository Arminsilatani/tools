<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <!-- :::::::::::::::::::::::::: META, FAVICON & STYLES :::::::::::::::::::::::::: -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Ubiro — Homebrew Cost Calculator</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/logos/Ub.svg">
    <link rel="stylesheet" href="../assets/css/Ubiro.css">
</head>
<body>
<!-- =========================== UBIRO COST CALCULATOR ============================ -->
<div class="app-wrapper">
    <!-- ------------------------- LOGO HEADER ------------------------- -->
    <div class="logo-container">
        <img src="../assets/images/logos/Ub.svg" alt="Ubiro Logo" class="logo-svg">
        <h1 class="logo-heading">
            <span class="logo-main">Ubiro</span>
            <span class="logo-sub">Beer Cost Calculator</span>
        </h1>
    </div>

    <!-- ------------------------- MAIN CARD ------------------------- -->
    <div class="main-card" id="mainCard">
        <!-- ------------------------- VOLUME SECTION ------------------------- -->
        <div class="volume-section">
            <div class="volume-label">
                <span>How many liters of beer do you want to brew?</span>
            </div>
            <div class="volume-input-group">
                <input type="number" class="volume-input" id="volumeInput" value="12" min="1" max="500" step="1">
                <span class="volume-unit">Liters</span>
            </div>
            <div class="volume-preset-btns">
                <button class="preset-btn" data-volume="6">6 L</button>
                <button class="preset-btn active" data-volume="12">12 L</button>
                <button class="preset-btn" data-volume="18">18 L</button>
                <button class="preset-btn" data-volume="24">24 L</button>
                <button class="preset-btn" data-volume="30">30 L</button>
            </div>
            <p class="smart-hint">Ingredient amounts scale intelligently based on volume (12 L base)</p>
        </div>

        <!-- ------------------------- INGREDIENTS GRID ------------------------- -->
        <div class="ingredients-grid" id="ingredientsGrid"></div>

        <!-- ------------------------- RESULTS SECTION ------------------------- -->
        <div class="results-section" id="resultsSection">
            <div class="result-label">Cost per Liter</div>
            <div class="result-value" id="costPerLiter">—</div>
            <div class="result-unit">Toman / Liter</div>
            <div class="result-total" id="totalCostInfo"></div>
            <button class="breakdown-toggle" id="breakdownToggle">Show Details <span class="arrow">▾</span></button>
            <div class="breakdown-list" id="breakdownList"></div>
        </div>

        <!-- ------------------------- ACTION BUTTONS ------------------------- -->
        <div class="btn-row">
            <button class="btn-outline" id="resetBtn">Reset All</button>
        </div>
    </div>

    <!-- ------------------------- FOOTER ------------------------- -->
    <footer class="footer">
        <div class="footer-signature">
            <span class="crafted">crafted by</span>
            <img src="../assets/images/signature.svg" alt="Armin Silatani" class="signature">
        </div>
    </footer>
</div>

<!-- External JavaScript -->
<script src="../assets/js/Ubiro.js"></script>
</body>
</html>
