<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <!-- :::::::::::::::::::::::::: META & STYLES :::::::::::::::::::::::::: -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nolvo - Sitemap Builder</title>
  <meta name="description" content="Build comprehensive XML sitemaps effortlessly. Supports multi-language alternates, image & video sitemaps, and intelligent priority calculation. No sign-up required.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../assets/images/logos/No.svg">
  <link rel="stylesheet" href="../assets/css/Nolvo.css">
</head>
<body>

  <!-- =========================== SITEMAP BUILDER PAGE ============================ -->
  <div class="app-wrapper">

    <!-- ------------------------- HEADER SECTION ------------------------- -->
    <header class="app-header">
      <div class="title-row">
        <div class="logo-icon">
          <img src="../assets/images/logos/No.svg" alt="logo">
        </div>
        <h1 class="inline-title">
          <span class="nolvo">Nolvo</span>
          <span class="sb">Sitemap Builder</span>
        </h1>
      </div>
      <p class="subtitle tagline">
        The most advanced sitemap generator with multi-language support
      </p>
    </header>

    <!-- ------------------------- DOMAIN INPUT SECTION ------------------------- -->
    <div class="card">
      <div class="form-group">
        <label>Website Domain</label>
        <div class="domain-input-wrapper">
          <input id="domain" type="text" placeholder="https://example.com" value="https://example.com">
          <span class="domain-icon">🌐</span>
        </div>
      </div>
    </div>

    <!-- ------------------------- FOLDER UPLOAD SECTION ------------------------- -->
    <div class="card">
      <label>Website Folder (HTML)</label>
      <div class="file-upload-area" id="drop-area">
        <input type="file" id="folder" webkitdirectory multiple>
        <div class="upload-icon">📁</div>
        <p class="upload-text">Drop folder here or <strong>browse</strong></p>
      </div>
    </div>

    <!-- ------------------------- OUTPUT SECTION ------------------------- -->
    <div id="output" class="output-section"></div>

    <!-- ------------------------- REPORT SECTION ------------------------- -->
    <div class="card">
      <h3 class="section-title">Processing Report</h3>
      <div id="report" class="report">Ready to process</div>
    </div>

    <!-- ------------------------- FOOTER SECTION ------------------------- -->
    <footer class="footer">
      <div class="footer-signature">
        <span class="crafted">crafted by</span>
        <img src="../assets/images/signature.svg" alt="Armin Silatani" class="signature">
      </div>
    </footer>
  </div>

  <script src="../assets/js/Nolvo.js"></script>
</body>
</html>
